<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Floor 7">
<meta name="theme-color" content="#000000">
<title>Floor 7</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<script>
  // Apply saved theme before paint so there is no flash
  try { var t = localStorage.getItem('f7-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>

<div id="splash" aria-hidden="true">
  <div class="splash-word">Floor 7</div>
  <div class="splash-line"></div>
</div>

<div id="app">
  <nav id="nav" aria-label="Main">
    <div class="nav-brand">Floor 7</div>
    <button class="nav-item" data-view="calendar" aria-label="Calendar">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Calendar</span>
    </button>
    <button class="nav-item" data-view="journal" aria-label="Journal">
      <svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M9 9h6M9 13h6"/></svg><span>Journal</span>
    </button>
    <button class="nav-item" data-view="accounts" aria-label="Accounts">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Accounts</span>
    </button>
    <button class="nav-item" data-view="notes" aria-label="Notes">
      <svg viewBox="0 0 24 24"><path d="M16 3l5 5L9 20H4v-5z"/></svg><span>Notes</span>
    </button>
    <button class="nav-item" data-view="more" aria-label="More">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg><span>More</span>
    </button>
  </nav>

  <main id="main">
    <section id="view-calendar" class="view"></section>
    <section id="view-journal" class="view"></section>
    <section id="view-accounts" class="view"></section>
    <section id="view-notes" class="view"></section>
    <section id="view-more" class="view"></section>
  </main>

  <button id="fab" aria-label="Log a trade">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<div id="sheet-backdrop" hidden></div>
<div id="sheet" role="dialog" aria-modal="true" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<input type="file" id="file-shot" accept="image/*" hidden>
<input type="file" id="file-chart" accept="image/*" hidden>
<input type="file" id="file-import" accept="application/json,.json" hidden>

<script src="db.js"></script>
<script src="reader.js"></script>
<script src="notes.js"></script>
<script src="app.js"></script>
</body>
</html>
